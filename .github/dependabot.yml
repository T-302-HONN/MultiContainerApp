# Weekly dependency updates; security fixes run as vulnerabilities are detected.
---
version: 2
updates:
- package-ecosystem: pip
  directories:
  - "/1-best-number-frontend"
  - "/2-best-number-backend"
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Atlantic/Reykjavik
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    security:
      applies-to: security-updates
      patterns:
      - "*"
- package-ecosystem: docker
  directories:
  - "/1-best-number-frontend"
  - "/2-best-number-backend"
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Atlantic/Reykjavik
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    security:
      applies-to: security-updates
      patterns:
      - "*"
